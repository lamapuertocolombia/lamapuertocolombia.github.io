<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tienda - LAMA Puerto Colombia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="navPlaceholder"></div>

  <section class="section">
    <div class="container">
      <h1 class="section-title">Tienda</h1>
      <p class="section-sub">Agrega productos al carrito y paga coordinando por WhatsApp</p>
      <div id="tiendaGrid" class="grid grid-3">
        <p class="state">Cargando productos...</p>
      </div>
    </div>
  </section>

  <div id="footerPlaceholder"></div>

  <div class="pilot-modal-overlay" id="productModalOverlay">
    <div class="pilot-modal">
      <button class="pilot-modal-close" id="productModalClose" aria-label="Cerrar">✕</button>
      <div class="pilot-modal-media" id="productModalMedia"></div>
      <div class="pilot-modal-info" id="productModalInfo"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/csv.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/tienda.js"></script>
</body>
</html>
