<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Actividades - LAMA Puerto Colombia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="navPlaceholder"></div>

  <section class="section">
    <div class="container">
      <h1 class="section-title">Actividades</h1>
      <p class="section-sub">Próximas rodadas y eventos del capítulo</p>

      <div class="view-toggle">
        <button class="view-toggle-btn active" id="btnVistaLista" type="button">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1" fill="currentColor" stroke="none"/></svg>
          Lista
        </button>
        <button class="view-toggle-btn" id="btnVistaCalendario" type="button">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/><rect x="8" y="13.5" width="3" height="3" fill="currentColor" stroke="none"/></svg>
          Calendario
        </button>
      </div>

      <div id="actividadesList">
        <p class="state">Cargando actividades...</p>
      </div>
      <div id="actividadesCalendario" style="display:none"></div>
    </div>
  </section>

  <div id="footerPlaceholder"></div>

  <script src="js/config.js"></script>
  <script src="js/csv.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/actividades.js"></script>
</body>
</html>
